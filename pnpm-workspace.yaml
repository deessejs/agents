packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

allowBuilds:
  esbuild: true
  protobufjs: true

# ----------------------------------------------------------------------------
# Centralized version catalog — keeps deps aligned across all workspaces.
# Reference these versions from package.json with "catalog:".
# Add a new dep here once it's used by 2+ workspaces; remove when no consumers.
#
# Pinning policy:
#   - `^` ranges for build / test tooling: turbo, typescript, oxlint, oxfmt,
#     vitest, @types/node. Minor bumps are cheap and rarely break us.
#   - Exact pins for runtime libraries where ABI breaks are routine: the
#     ai-sdk family, @octokit/* (core only), pino, gpt-tokenizer, zod.
#     Pinning forces a deliberate bump on every minor.
#   - `^` is allowed for runtime deps where the upstream policy is
#     SemVer-strict: @opentelemetry/*, @octokit/types, @vercel/kv.
# ----------------------------------------------------------------------------
catalog:
  # Build / test tooling (caret-prefix OK; minor bumps are safe)
  turbo: ^2.3.0
  typescript: ^5.6.0
  "@changesets/cli": ^2.27.0
  vitest: ^2.1.0
  "@types/node": ^22.0.0

  # OXC toolchain (replaces ESLint + Prettier)
  oxlint: ^1.0.0
  oxfmt: ^0.71.0

  # Runtime — Zod schema validation is the public API boundary for every
  # package; a minor bump can reshape parsing semantics. Pinned.
  zod: ^4.1.8

  # Formatters (Phase 2 — @workspace/format).
  # date-fns majors ship breaking changes (v2→v3 dropped default exports;
  # v3→v4 introduced time-zone support). Pinned to ^4 (caret OK because
  # date-fns honors it strictly). mdast-util-to-hast and hast-util-to-html
  # are caret-pinned — both follow semver-strict unified collective policy.
  date-fns: ^4.4.0
  mdast-util-to-hast: ^13.2.1
  hast-util-to-html: ^9.0.5
  unified: ^11.0.5
  remark-parse: ^11.0.0
  "@types/hast": ^3.0.5
  "@types/mdast": ^4.0.4

  # AI SDK stack.
  # Versions pinned because ai-sdk majors frequently break ABI without
  # bumping major (e.g. @ai-sdk/provider@4.x and @ai-sdk/provider-utils@5.x
  # coexist on purpose — the provider-utils major is one ahead). The
  # provider package itself is the integration surface every other
  # @ai-sdk/* aligns against.
  ai: 7.0.127
  "@ai-sdk/anthropic": 4.0.71
  "@ai-sdk/minimax": 3.0.48
  "@ai-sdk/provider-utils": 5.0.53
  gpt-tokenizer: ^2.5.0

  # Observability (pinned — otel SDK majors ship breaking changes;
  # @opentelemetry/* stays caret because their published majors are reliable)
  pino: ^9.5.0
  pino-pretty: ^11.3.0
  "@opentelemetry/api": ^1.9.0
  "@opentelemetry/sdk-node": ^0.222.0
  "@opentelemetry/exporter-trace-otlp-http": ^0.222.0
  "@opentelemetry/resources": ^2.0.0
  "@opentelemetry/semantic-conventions": ^1.27.0

  # GitHub API (pinned — octokit majors ship breaking changes;
  # cross-plugin compatibility is verified only at exact ranges)
  "@octokit/core": 7.0.8
  "@octokit/plugin-throttling": 11.0.5
  "@octokit/plugin-paginate-rest": 16.0.0
  "@octokit/plugin-retry": 8.1.1
  "@octokit/types": ^18.0.0

  # Vercel KV (used by env, observability, runtime for state/dedup)
  "@vercel/kv": ^3.0.0

  # Email (Phase 2 — @workspace/email).
  # resend: caret (Resend majors are rare and the SDK is small + stable).
  # react-email: caret (the v6 line unifies @react-email/components +
  # @react-email/render into a single package; the older components
  # package is being deprecated, so we use the new one).
  # react/react-dom: caret (peer deps of react-email — v18.2.0+ or v19).
  resend: ^6.32.0
  react-email: ^6.9.1
  react: ^19.0.0
  react-dom: ^19.0.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0

  # eve framework (Phase 2 — apps/technical-analyst).
  # Pre-1.0, released every few weeks. Caret OK; the runtime doc's
  # snippets reference `eve/schedules`, `eve/skills`, and the
  # `defineSchedule({ cron, markdown })` fire-and-forget form.
  # Upgrade policy: every minor bump requires re-reading the runtime
  # doc snippets in temp/agent/technical-analyst.md against the new
  # eve API (the framework is still 0.x).
  eve: ^0.68.0

  # Concurrency (Phase 2 — apps/technical-analyst).
  # p-limit: caret (no breaking changes; library is small + stable).
  p-limit: ^6.1.0
